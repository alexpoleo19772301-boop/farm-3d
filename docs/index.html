<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#3d2914"/>
<title>Винтики</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#2a1a0c;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
#wrap{position:relative;width:100%;height:100%;max-width:100%;margin:0 auto;background:radial-gradient(ellipse at 50% 30%,#5a3a1e,#2a1a0c 70%)}
canvas#game{display:block;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:5;background:rgba(20,10,5,.72);backdrop-filter:blur(4px)}
.screen.on{display:flex}
.card{background:linear-gradient(180deg,#8b5a2b,#5c3a18);border:3px solid #e8c48a;border-radius:22px;padding:22px 20px;width:min(92%,360px);box-shadow:0 12px 40px rgba(0,0,0,.45);text-align:center}
.card h1{font-size:28px;margin-bottom:8px;color:#fff6e0;text-shadow:0 2px 0 #3a2008}
.card p{opacity:.92;margin:8px 0 16px;line-height:1.4;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#f0c45a,#d4922a);color:#3a2008;font-weight:800;border:none;border-radius:16px;padding:14px 22px;font-size:17px;margin:6px;cursor:pointer;box-shadow:0 4px 0 #8a5a18;min-width:140px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a18}
.btn.ghost{background:linear-gradient(180deg,#6b4a2a,#4a3018);color:#ffe8c0;box-shadow:0 4px 0 #2a1808}
.btn.green{background:linear-gradient(180deg,#7dcf5a,#3a9a28);color:#14380c;box-shadow:0 4px 0 #1e6010}
#hud{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) 10px 0}
#hud .row{display:flex;gap:8px;align-items:center;pointer-events:auto}
.pill{background:rgba(40,22,10,.82);border:2px solid #c9a06a;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:#ffe8c0}
.pill button,.iconbtn{pointer-events:auto;background:#5c3a18;border:2px solid #e8c48a;color:#fff;border-radius:12px;padding:8px 10px;font-weight:700;cursor:pointer}
#boosters{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;gap:12px;padding:0 12px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.booster{pointer-events:auto;width:72px;height:72px;border-radius:18px;background:linear-gradient(180deg,#6b4a2a,#3d2814);border:3px solid #e8c48a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#ffe8c0;position:relative;cursor:pointer}
.booster .ic{font-size:22px;line-height:1}
.booster .badge{position:absolute;top:-6px;right:-6px;background:#e23;border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff}
#ver{position:absolute;right:8px;bottom:4px;z-index:6;font-size:11px;opacity:.55;pointer-events:none}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.75);padding:10px 16px;border-radius:12px;display:none;font-size:14px;max-width:90%;text-align:center}
#mapgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:55vh;overflow:auto;padding:4px;width:100%}
.mapcell{aspect-ratio:1;border-radius:12px;background:#4a3018;border:2px solid #c9a06a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;cursor:pointer;color:#ffe8c0}
.mapcell.lock{opacity:.4;cursor:default}
.mapcell.done{background:#3a6a28;border-color:#9de06a}
.stars{font-size:10px;letter-spacing:1px;color:#ffd76a}
#logoTitle{font-size:42px;font-weight:900;color:#fff3d0;text-shadow:0 3px 0 #5a3010,0 8px 18px rgba(0,0,0,.45);letter-spacing:1px;margin-bottom:6px}
.sub{opacity:.85;margin-bottom:18px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud" style="display:none">
    <div class="row">
      <button class="iconbtn" id="btn-map">Карта</button>
      <span class="pill" id="lvl-pill">Ур. 1</span>
      <span class="pill" id="coin-pill">🪙 0</span>
      <span style="flex:1"></span>
      <button class="iconbtn" id="btn-sound">🔊</button>
      <button class="iconbtn" id="btn-update" title="Обновить">↻</button>
    </div>
  </div>
  <div id="boosters" style="display:none">
    <div class="booster" id="b-slot"><div class="ic">➕</div>Слот<div class="badge" id="badge-slot">2</div></div>
    <div class="booster" id="b-hammer"><div class="ic">🔨</div>Молот<div class="badge" id="badge-hammer">2</div></div>
    <div class="booster" id="b-hint"><div class="ic">💡</div>Хинт<div class="badge" id="badge-hint">3</div></div>
  </div>
  <div class="screen on" id="sc-home">
    <div id="logoTitle">Винтики</div>
    <div class="sub">Доски в поле · замки и ряды · цвета</div>
    <div class="card">
      <p>Доски не наезжают друг на друга. Замки и нижний ряд открываются по плану. Смотри цвет коробки!</p>
      <button class="btn green" id="btn-play">Играть</button>
      <button class="btn ghost" id="btn-home-map">Карта уровней</button>
      <button class="btn ghost" id="btn-home-update">Обновить</button>
    </div>
  </div>
  <div class="screen" id="sc-map">
    <div class="card" style="width:min(96%,400px)">
      <h1>Карта</h1>
      <div id="mapgrid"></div>
      <button class="btn ghost" id="btn-map-back">Назад</button>
    </div>
  </div>
  <div class="screen" id="sc-win">
    <div class="card">
      <h1>Победа! 🎉</h1>
      <p id="win-stars">★★★</p>
      <p id="win-coins">+50 монет</p>
      <button class="btn green" id="btn-next">Дальше</button>
      <button class="btn ghost" id="btn-win-map">Карта</button>
    </div>
  </div>
  <div class="screen" id="sc-lose">
    <div class="card">
      <h1>Слоты полны</h1>
      <p>Ждущие винты забили ряд. Попробуй ещё раз!</p>
      <button class="btn" id="btn-retry">Заново</button>
      <button class="btn ghost" id="btn-lose-map">Карта</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="ver">v3.4.1</div>
</div>
<script src="vendor/matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
